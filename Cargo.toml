[package]
name = "delta-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dlt"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
anyhow = "1.0.104"
backoff = { version = "0.4.0", features = ["tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
minijinja = "2.24.0"
notify = "8.2.0"
ratatui = "0.29.0"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
similar = "3.1.2"
textwrap = "0.16.2"
thiserror = "2.0.20"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tui-textarea = "0.7.0"
unicode-width = "0.2.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

id: proposal
name: Proposal
inputs: []
min_rigor: trivial
template: |
  {{ agents_md }}
  ## Current truth
  {{ truth.relevant }}
  ## Repository
  {{ repo_tree }}
  ## What the user asked for
  {{ current }}
  Expand the above into a full proposal: the problem it solves and the
  shape of the fix. If nothing was given above beyond a placeholder,
  say so plainly rather than inventing a feature.
output:
  required_sections: [Problem, Approach]
  validators:
    - non_empty_sections
    - no_placeholder_text
    - min_words: 50

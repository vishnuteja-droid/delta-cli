# delta adapters — the CLI format table.
#
# Each entry describes where one tool looks for command files and what shape
# they take. `delta/bin/generate-commands` reads this file and emits per-tool
# files from the canonical sources in `delta/commands/`. The generated files
# are committed.
#
# Adding support for a new CLI is an entry in this file. It is never a code
# change. That is the whole point: this landscape churns, and an adapter
# written as a code module rots every time a vendor moves a directory.
#
# Fields
#   id          slug used in generator output
#   name        human name
#   dir         project-level directory the tool loads commands from,
#               relative to repo root. Committing files here still wins over
#               the user-level copy in every listed tool - a team that wants
#               a pinned or customised variant gets it by committing this.
#   user_dir    machine-level directory, relative to $HOME. `delta/bin/install`
#               writes here once; every repo on that machine picks it up with
#               no per-repo setup. This is the directory that makes delta
#               available before a repo has ever seen it.
#   ext         file extension
#   naming      prefix -> delta-explore.<ext>        invoked /delta-explore
#               subdir -> delta/explore.<ext>        invoked /delta:explore
#   format      frontmatter -> markdown with YAML front matter
#               toml        -> description + prompt keys
#               plain       -> body only, front matter stripped
#   args        the token this tool substitutes arguments into
#   name_field  yes -> inject `name:` into front matter (Agent Skills style)
#   verified    date the format below was last checked against live docs
#   docs        where it was checked
#   invoke      what the user types
#   note        anything a reader needs to know about this entry
#   install     extra step required because the tool cannot load from the repo

adapters:
  - id: claude
    name: Claude Code
    dir: .claude/commands
    user_dir: .claude/commands
    ext: md
    naming: prefix
    format: frontmatter
    args: $ARGUMENTS
    name_field: no
    verified: 2026-08-26
    docs: https://code.claude.com/docs/en/slash-commands
    invoke: /delta-explore
    note: Docs define a command name as the file name without extension, and subdirectory namespacing has a standing bug report, so files are emitted flat with a delta- prefix rather than as delta/explore.md. User-level ~/.claude/commands/ is documented as personal, cross-project, never committed - exactly what delta/bin/install targets.
    install: none

  - id: gemini
    name: Gemini CLI
    dir: .gemini/commands
    user_dir: .gemini/commands
    ext: toml
    naming: subdir
    format: toml
    args: "{{args}}"
    name_field: no
    verified: 2026-08-26
    docs: https://geminicli.com/docs/cli/custom-commands/
    invoke: /delta:explore
    note: Subdirectories namespace with a colon, so delta/explore.toml becomes /delta:explore. Required key is prompt; description is optional and included. Docs describe both a global ~/.gemini/commands/ (all sessions) and a project .gemini/commands/ (that project only), with project taking precedence - the split this table now models for every adapter.
    install: none

  - id: antigravity
    name: Antigravity CLI
    dir: .agents/skills
    user_dir: .gemini/config/skills
    ext: md
    naming: prefix
    format: frontmatter
    args: $ARGUMENTS
    name_field: yes
    verified: 2026-08-26
    docs: https://antigravity.google/docs/cli/plugins/
    invoke: /delta-explore
    note: Workspace skills live in .agents/skills and stay with the repository. A project still carrying .gemini/skills should rename that folder to .agents/skills.
    user_dir_verified: single secondary source (no official doc reachable from this environment's egress proxy); confirm against Antigravity's own docs before relying on it. If wrong, this is a one-line fix in this table.
    install: none

  - id: codex
    name: Codex
    dir: .codex/prompts
    user_dir: .codex/prompts
    ext: md
    naming: prefix
    format: frontmatter
    args: $ARGUMENTS
    name_field: no
    verified: 2026-08-26
    docs: https://developers.openai.com/codex/custom-prompts
    invoke: /delta-explore
    note: Codex loads prompts from $CODEX_HOME/prompts only - project-scoped .codex/prompts is an open feature request, not shipped. That makes user_dir the ONLY location that has ever worked for Codex; dir/project-level output is emitted anyway so it is versioned and ready if project-scoped loading lands, but delta/bin/install writing to user_dir is what actually makes /delta-explore appear in Codex today. Codex reads AGENTS.md from the repo natively regardless.
    install: none
